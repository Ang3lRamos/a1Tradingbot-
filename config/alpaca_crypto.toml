# Cuarto bot: RSI2 sobre cripto al contado en la cuenta de práctica de Alpaca (la misma del bot de ETF).
# Prueba técnica: el backtest no muestra ventaja (research/h07_crypto_alpaca.py, ver [backtest]).
# Mercado 24/7. La vela diaria de Alpaca empieza a medianoche UTC = 19:00 de Nueva York (20:00 en horario de verano),
# que es la "hora del servidor" de este bot: la señal se evalúa y entra entre las 19:00 y las 19:15.
# Sin cortos ni bracket en cripto: entrada a mercado GTC y stop-limit GTC aparte en el servidor (io/alpaca_crypto.py).

[bot]
broker = "alpaca_crypto"
mode = "dry_run"
allow_real_account = false
symbols = ["BTC/USD", "ETH/USD", "SOL/USD"]
timeframe = "D1"
magic = 260514
max_entry_delay_minutes = 15
journal_path = "~/.mt5bot/journal_alpaca_crypto.db"
kill_switch_file = "STOP"         # el mismo archivo detiene a todos los bots

[strategy]
name = "rsi2"
target_r = 6.0                    # sale por regla; el objetivo solo cumple el filtro de riesgo (no se envía)
breakeven_at_r = 0
trail_atr = 0
atr_period = 14
flat_by = ""

[strategy.orb]
range_start = "00:00"
range_end = "01:00"
entry_until = "02:00"
stop_mode = "range_mid"

[strategy.donchian]
channel_bars = 20
trend_ema = 200
stop_atr = 2.0

[strategy.rsi2]
rsi_period = 2
entry_below = 10.0
trend_sma = 200
exit_sma = 5
stop_atr = 3.0
max_bars = 10
weekends = true                   # en cripto sábado y domingo son días normales

[risk]
risk_per_trade_pct = 1.0                # cuenta de 100 USD: 1 USD de riesgo por operación (decidido 2026-11-08)
max_daily_loss_pct = 2.0          # se mide sobre toda la cuenta de Alpaca (incluye el bot de ETF)
max_trades_per_day = 3
max_open_positions = 3
max_spread_points = 5000          # 1 punto = 1 centavo; BTC/USD anda en ~1900 (19 USD): solo frena cotizaciones absurdas
min_reward_risk = 1.0
trading_hours = ["00:00", "23:59"]
friday_close = ""

[backtest]
initial_balance = 100.0
spread_points = 2
commission_per_lot = 0.0          # la comisión de cripto es un porcentaje (0.25 % por lado): la descuenta el estudio
monte_carlo_runs = 10000
seed = 19
# Datos diarios de Alpaca 2021-2026, BTC+ETH+SOL, comisión 0.25 % por lado (research/h07_crypto_alpaca.py, 126 ops):
# +0.062 R en 2021-2023 y -0.024 R desde 2024. Sin ventaja.
expected_win_rate_pct = 58.7
expected_avg_r = 0.010
expected_trades_per_month = 2.0
